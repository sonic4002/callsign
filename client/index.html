<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1013">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Callsign</title>
<link rel="icon" href="icons/mark.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest" id="manifest">
<link rel="stylesheet" href="debug.css">
<link rel="stylesheet" href="brains/monitor.css">
<link rel="stylesheet" href="mobile.css">
<link rel="stylesheet" href="tutorial.css">
</head>
<body>
<main>
  <section id="stage">
    <div id="map-wrap">
      <!-- The map never mirrors: the canvas is always drawn west on the left. -->
      <canvas id="map" dir="ltr"></canvas>
      <div id="zoom" dir="ltr">
        <button type="button" id="zoom-in" data-i18n-aria="zoomIn">+</button>
        <button type="button" id="zoom-out" data-i18n-aria="zoomOut">−</button>
        <button type="button" id="zoom-fit" data-i18n-aria="zoomFit">⤢</button>
      </div>
      <!-- The first lesson's coach: one line at a time over a real match (tutorial.js). -->
      <aside id="coach" aria-live="polite" hidden>
        <header>
          <strong data-i18n="tut.title"></strong>
          <bdi id="coach-count" dir="ltr"></bdi>
          <button type="button" id="coach-leave" data-i18n-aria="tut.leave">×</button>
        </header>
        <p id="coach-text"></p>
        <div class="row">
          <button type="button" id="coach-skip" data-i18n="tut.skip"></button>
          <button type="button" class="primary" id="coach-next" data-i18n="tut.next"></button>
          <button type="button" id="coach-stay" data-i18n="tut.stay" hidden></button>
          <button type="button" class="primary" id="coach-real" data-i18n="tut.real" hidden></button>
        </div>
      </aside>
      <div id="orders" hidden>
        <strong id="orders-title"></strong>
        <div>
          <button type="button" data-order="hold" data-i18n="act.hold"></button>
          <button type="button" data-order="move" data-i18n="act.move"></button>
          <button type="button" data-order="attack" data-i18n="act.attack"></button>
        </div>
      </div>
    </div>
    <section id="radio" class="panel">
      <h2 data-i18n="radioLog"></h2>
      <ol id="log" aria-live="polite"></ol>
      <form id="send">
        <input id="text" type="text" dir="auto" autocomplete="off" spellcheck="false" data-i18n-placeholder="placeholder">
        <button type="button" id="ptt" data-i18n-aria="voiceButton">🎤</button>
        <button type="button" id="speak" data-i18n-aria="speechButton">🔊</button>
        <button type="submit" class="primary" data-i18n="send"></button>
      </form>
      <p id="voice-status" aria-live="polite" hidden></p>
    </section>
  </section>

  <aside id="sidebar">
    <header class="panel" data-sheet="more">
      <h1 data-i18n="title"></h1>
      <div id="controls">
        <button type="button" id="help-open" data-i18n="help"></button>
        <button type="button" id="brains-open" data-i18n="brains"></button>
        <button type="button" id="lang" data-i18n="language"></button>
        <button type="button" id="restart" data-i18n="restart"></button>
        <button type="button" id="exit" data-i18n="exit"></button>
      </div>
    </header>

    <section id="treasury" class="panel">
      <div id="gold-box">
        <span data-i18n="gold"></span>
        <strong><bdi dir="ltr" id="gold">–</bdi></strong>
        <small><bdi dir="ltr" id="income">–</bdi> <span data-i18n="income"></span></small>
      </div>
      <dl>
        <div><dt data-i18n="timeLeft"></dt><dd><bdi dir="ltr" id="time">–</bdi><bdi dir="ltr" id="pace" hidden></bdi></dd></div>
        <div><dt data-i18n="points"></dt><dd><bdi dir="ltr" id="held">–</bdi></dd></div>
      </dl>
      <div class="bars">
        <label><span data-i18n="hqOurs"></span><i class="bar ours"><b id="hq-ours"></b></i></label>
        <label><span data-i18n="hqEnemy"></span><i class="bar enemy"><b id="hq-enemy"></b></i></label>
      </div>
    </section>

    <section class="panel" data-sheet="more">
      <h2 data-i18n="radar"></h2>
      <canvas id="radar-map" dir="ltr"></canvas>
    </section>

    <section class="panel grow" data-sheet="squads">
      <h2><span data-i18n="roster"></span> <bdi dir="ltr" id="pop"></bdi></h2>
      <!-- Who has the initiative: the player, or Anvil. The button only transmits the call. -->
      <p id="command" hidden><span id="command-mode"></span> <button type="button" id="command-switch"></button> <button type="button" id="command-purse"></button></p>
      <ul id="roster"></ul>
    </section>

    <!-- The side's AI agents at a glance; the whole view opens from here or from "AI". -->
    <section id="monitor-panel" class="panel" hidden>
      <h2 data-i18n="monitor.title"></h2>
      <ul id="monitor-strip" data-i18n-aria="monitor.open"></ul>
    </section>

    <section class="panel" data-sheet="build">
      <h2 data-i18n="build"></h2>
      <div id="build"></div>
    </section>

    <section id="music" class="panel" data-sheet="more" hidden>
      <button type="button" id="mute" data-i18n-aria="mute">♪</button>
      <input type="range" id="volume" min="0" max="1" step="0.05" data-i18n-aria="volume">
      <span id="track"></span>
    </section>

    <footer class="panel" data-sheet="more">
      <label><input type="checkbox" id="nerve"> <span data-i18n="showNerve"></span></label>
      <label><span data-i18n="strict"></span>
        <select id="strict">
          <option value="1" data-i18n="strict.1"></option>
          <option value="2" data-i18n="strict.2"></option>
          <option value="3" data-i18n="strict.3"></option>
        </select>
      </label>
      <p id="hint" data-i18n="hint"></p>
    </footer>
  </aside>
</main>

<!-- Phones: the panels above open as sheets from this bar; the talk button sits in its middle. -->
<nav id="dock">
  <button type="button" data-open="radio" data-i18n="tab.radio"></button>
  <button type="button" data-open="squads" data-i18n="roster"></button>
  <button type="button" data-open="build" data-i18n="tab.build"></button>
  <button type="button" data-open="more" data-i18n="tab.more"></button>
</nav>
<p id="no-server" role="status" data-i18n="noServer"></p>

<div id="overlay">
  <div class="card">
    <h1 id="overlay-title"></h1>
    <p id="overlay-line"></p>
    <p id="overlay-side"></p>
    <!-- The first lesson: offered before anything else on the start screen. -->
    <div id="learn" hidden>
      <button type="button" class="primary" id="learn-start" data-i18n="tut.learn"></button>
      <p data-i18n="tut.learnAbout"></p>
    </div>
    <!-- The lobby: make a match, or join one by its code; then the seats until both are ready. -->
    <form id="lobby-new" hidden>
      <fieldset>
        <legend data-i18n="lobby.opponent"></legend>
        <label><input type="radio" name="opponent" value="bot" checked> <span data-i18n="lobby.bot"></span></label>
        <label><input type="radio" name="opponent" value="friend"> <span data-i18n="lobby.friend"></span></label>
      </fieldset>
      <label id="lobby-level-row"><span data-i18n="lobby.level"></span>
        <select name="bot" id="lobby-level">
          <option value="easy" data-i18n="lobby.level.easy"></option>
          <option value="normal" data-i18n="lobby.level.normal"></option>
          <option value="standard" data-i18n="lobby.level.standard"></option>
        </select>
        <small id="lobby-level-about"></small>
      </label>
      <fieldset>
        <legend data-i18n="lobby.side"></legend>
        <label><input type="radio" name="side" value="0" checked> <span id="lobby-side-0"></span></label>
        <label><input type="radio" name="side" value="1"> <span id="lobby-side-1"></span></label>
        <label><input type="radio" name="side" value="-1"> <span data-i18n="lobby.random"></span></label>
      </fieldset>
      <label><span data-i18n="lobby.length"></span>
        <select name="length" id="lobby-length"></select>
      </label>
      <label id="lobby-speed-row"><span data-i18n="lobby.speed"></span>
        <select name="speed" id="lobby-speed">
          <option value="relaxed" data-i18n="lobby.speed.relaxed"></option>
          <option value="normal" data-i18n="lobby.speed.normal" selected></option>
          <option value="fast" data-i18n="lobby.speed.fast"></option>
        </select>
        <small id="lobby-speed-about"></small>
      </label>
      <label id="lobby-purse"><input type="checkbox" name="purse"> <span data-i18n="lobby.purse"></span></label>
      <label id="lobby-watch"><input type="checkbox" name="watch"> <span data-i18n="lobby.watch"></span></label>
      <fieldset id="lobby-host" hidden>
        <legend data-i18n="lobby.hostKey"></legend>
        <p data-i18n="lobby.hostAbout"></p>
        <input name="hostKey" id="lobby-host-key" type="password" dir="ltr" autocomplete="off" data-i18n-placeholder="lobby.hostKey">
      </fieldset>
    </form>
    <section id="lobby-room" hidden>
      <p><span data-i18n="lobby.codeIs"></span> <strong id="lobby-code" dir="ltr"></strong></p>
      <p id="lobby-share">
        <input id="lobby-link" type="text" dir="ltr" readonly data-i18n-aria="lobby.link">
        <button type="button" id="lobby-copy" data-i18n="lobby.copy"></button>
      </p>
      <p id="lobby-pace"></p>
      <ul id="lobby-seats"></ul>
      <p id="lobby-status"></p>
      <p id="lobby-note"></p>
    </section>
    <p id="lobby-error" role="alert" hidden></p>
    <div class="row">
      <button type="button" class="primary" id="start"></button>
      <button type="button" id="lobby-leave" data-i18n="lobby.leave" hidden></button>
      <button type="button" id="overlay-lang" data-i18n="language"></button>
    </div>
    <form id="lobby-join" hidden>
      <label><span data-i18n="lobby.code"></span>
        <input name="code" id="lobby-join-code" type="text" dir="ltr" maxlength="5" autocomplete="off" autocapitalize="characters" spellcheck="false">
      </label>
      <button type="submit" data-i18n="lobby.join"></button>
    </form>
    <details id="credits" hidden>
      <summary data-i18n="credits"></summary>
      <ul id="credits-list"></ul>
    </details>
  </div>
</div>
<div id="help" hidden>
  <div class="card">
    <h1 data-i18n="help.title"></h1>
    <div class="tabs" role="tablist">
      <button type="button" role="tab" data-tab="guide" data-i18n="help.tab.guide"></button>
      <button type="button" role="tab" data-tab="examples" data-i18n="help.tab.examples"></button>
    </div>
    <section data-pane="guide">
      <p class="learn-again"><button type="button" id="help-learn" data-i18n="tut.again"></button> <span data-i18n="tut.againAbout"></span></p>
      <h2 data-i18n="help.talk"></h2>
      <p data-i18n="help.talk.body"></p>
      <h2 data-i18n="help.asked"></h2>
      <dl class="asked">
        <dt data-i18n="help.q.move"></dt><dd data-i18n="help.a.move"></dd>
        <dt data-i18n="help.q.auto"></dt><dd data-i18n="help.a.auto"></dd>
        <dt data-i18n="help.q.upgrade"></dt><dd data-i18n="help.a.upgrade"></dd>
        <dt data-i18n="help.q.speed"></dt><dd data-i18n="help.a.speed"></dd>
        <dt data-i18n="help.q.units"></dt><dd data-i18n="help.a.units"></dd>
      </dl>
      <h2 data-i18n="strict"></h2>
      <ul>
        <li><strong data-i18n="strict.1"></strong> <span data-i18n="help.strict.1"></span></li>
        <li><strong data-i18n="strict.2"></strong> <span data-i18n="help.strict.2"></span></li>
        <li><strong data-i18n="strict.3"></strong> <span data-i18n="help.strict.3"></span></li>
      </ul>
      <h2 data-i18n="help.more"></h2>
      <p data-i18n="help.more.body"></p>
    </section>
    <section data-pane="examples" hidden>
      <p data-i18n="help.ex.intro"></p>
      <h2 data-i18n="help.ex.squads"></h2>
      <ul class="examples">
        <li><span data-i18n="help.attack"></span><code dir="auto" data-i18n="help.attack.say"></code></li>
        <li><span data-i18n="help.attackTarget"></span><code dir="auto" data-i18n="help.attackTarget.say"></code></li>
        <li><span data-i18n="help.attackAny"></span><code dir="auto" data-i18n="help.attackAny.say"></code></li>
        <li><span data-i18n="help.hold"></span><code dir="auto" data-i18n="help.hold.say"></code></li>
        <li><span data-i18n="help.move"></span><code dir="auto" data-i18n="help.move.say"></code></li>
        <li><span data-i18n="help.fallBack"></span><code dir="auto" data-i18n="help.fallBack.say"></code></li>
        <li><span data-i18n="help.several"></span><code dir="auto" data-i18n="help.several.say"></code></li>
        <li><span data-i18n="help.report"></span><code dir="auto" data-i18n="help.report.say"></code></li>
        <li><span data-i18n="help.all"></span><code dir="auto" data-i18n="help.all.say"></code></li>
      </ul>
      <h2 data-i18n="help.ex.anvil"></h2>
      <ul class="examples">
        <li><span data-i18n="help.manage"></span><code dir="auto" data-i18n="help.manage.say"></code></li>
        <li><span data-i18n="help.status"></span><code dir="auto" data-i18n="help.status.say"></code></li>
        <li><span data-i18n="help.buy"></span><code dir="auto" data-i18n="help.buy.say"></code></li>
        <li><span data-i18n="help.buyNaval"></span><code dir="auto" data-i18n="help.buyNaval.say"></code></li>
        <li><span data-i18n="help.upgrade"></span><code dir="auto" data-i18n="help.upgrade.say"></code></li>
      </ul>
      <h2 data-i18n="help.ex.procedure"></h2>
      <ul class="examples">
        <li><span data-i18n="help.radioCheck"></span><code dir="auto" data-i18n="help.radioCheck.say"></code></li>
        <li><span data-i18n="help.full"></span><code dir="auto" data-i18n="help.full.say"></code></li>
      </ul>
    </section>
    <div class="row"><button type="button" class="primary" id="help-close" data-i18n="help.close"></button></div>
  </div>
</div>
<dialog id="brains">
  <form method="dialog">
    <h1 data-i18n="brains.title"></h1>
    <div class="tabs" role="tablist">
      <button type="button" role="tab" data-brains-tab="live" data-i18n="monitor.tab.live"></button>
      <button type="button" role="tab" data-brains-tab="key" data-i18n="monitor.tab.key"></button>
    </div>
    <section data-brains-pane="live">
      <p id="monitor-side"></p>
      <ul id="monitor-list"></ul>
      <p class="fine" data-i18n="monitor.about"></p>
    </section>
    <section data-brains-pane="key" hidden>
    <p id="brains-status" aria-live="polite"></p>
    <fieldset>
      <legend data-i18n="brains.key"></legend>
      <p id="brains-keyline"></p>
      <label><span data-i18n="brains.provider"></span>
        <select id="brains-provider">
          <option value="anthropic" data-i18n="provider.anthropic"></option>
          <option value="openrouter" data-i18n="provider.openrouter"></option>
          <option value="gemini" data-i18n="provider.gemini"></option>
          <option value="openai" data-i18n="provider.openai"></option>
        </select>
      </label>
      <label><span data-i18n="brains.keyLabel"></span>
        <input id="brains-input" type="password" dir="ltr" autocomplete="off" spellcheck="false">
      </label>
      <div class="row">
        <button type="button" class="primary" id="brains-save" data-i18n="brains.save"></button>
        <button type="button" id="brains-remove" data-i18n="brains.remove" hidden></button>
      </div>
      <p id="brains-note" class="warn" role="alert" hidden></p>
      <p data-i18n="brains.where"></p>
    </fieldset>
    <label class="check"><input type="checkbox" id="brains-demo"> <span data-i18n="brains.demoChoice"></span></label>
    <h2 data-i18n="brains.usage"></h2>
    <p id="brains-usage"></p>
    </section>
    <div class="row"><button type="submit" data-i18n="brains.close"></button></div>
  </form>
</dialog>
<script type="module" src="mobile.js"></script>
<script type="module" src="debug.js"></script>
</body>
</html>
