# make play: the game server and the agent host, both from the callsign-dev image.
# Open http://localhost:8080, make a match in the lobby and transmit as Hammer.
services:
  server:
    image: callsign-dev
    init: true
    user: "${CALLSIGN_UID:-1000}:${CALLSIGN_GID:-1000}"
    working_dir: /src
    environment:
      HOME: /tmp
      # The secret the agent host shows the server. `make play` makes a new one each run;
      # empty leaves the server trusting every agent, which is only safe on this machine.
      CALLSIGN_AGENT_KEY: "${CALLSIGN_AGENT_KEY:-}"
      CALLSIGN_SHARE: "${CALLSIGN_SHARE:-}" # set by `make play-lan`: the address a friend opens
      CALLSIGN_HOST_KEY: "${CALLSIGN_HOST_KEY:-}" # set by `make play-public`: only the host makes matches
    volumes:
      - .:/src:ro
      - callsign-gocache:/gocache
    # CALLSIGN_BOT picks the scripted enemy: easy (default), normal, standard (relentless) or rush.
    # CALLSIGN_BOT= (set but empty) plays with no scripted enemy.
    command: ["go", "run", "./server/cmd/callsign", "-addr=:8080", "-seed=${CALLSIGN_SEED:-1}", "-bot=${CALLSIGN_BOT-easy}", "-tts=http://tts:5002", "-relay=http://relay:8090"]
    ports:
      # This machine only, unless `make play-lan` opens it to the network (docs/FRIEND-MATCH.md).
      - "${CALLSIGN_BIND:-127.0.0.1}:8080:8080"

  agents:
    image: callsign-dev
    init: true
    user: "${CALLSIGN_UID:-1000}:${CALLSIGN_GID:-1000}"
    working_dir: /src
    env_file: .env
    environment:
      HOME: /tmp
      CALLSIGN_SERVER: ws://server:8080/ws
      CALLSIGN_AGENT_KEY: "${CALLSIGN_AGENT_KEY:-}"
    volumes:
      - .:/src:ro
    command: node agents/main.mjs
    depends_on:
      - server

  # The squads' voices, for testing (tts/server.py). `make play` starts it only when the
  # image and the models are there (make tts-image, make tts-models); without it the page
  # uses the browser's own voice.
  tts:
    profiles: ["voice"]
    image: callsign-tts
    init: true
    user: "${CALLSIGN_UID:-1000}:${CALLSIGN_GID:-1000}"
    working_dir: /tmp
    environment:
      HOME: /tmp
    volumes:
      - .:/src:ro
      - ./assets/voice-cache:/cache
    command: ["python", "/src/tts/server.py", "--cache=/cache"]

  # The model relay: holds each player's AI key, encrypted under .relay-data/, and calls
  # the AI provider with the model the squad's brain tier allows. It is reached only
  # through the game server, at /relay/, and has no port of its own.
  relay:
    image: callsign-dev
    init: true
    user: "${CALLSIGN_UID:-1000}:${CALLSIGN_GID:-1000}"
    working_dir: /src
    environment:
      HOME: /tmp
      CALLSIGN_RELAY_MASTER_KEY: "${CALLSIGN_RELAY_MASTER_KEY:-}"
      # The game's own TypeSafe key for the squads' fast brain (Jev). Its value lives in .env
      # and is never written here. Empty: the fast brain is off, the rule brain plays.
      CALLSIGN_JEV_KEY: "${CALLSIGN_JEV_KEY:-}"
      CALLSIGN_AGENT_KEY: "${CALLSIGN_AGENT_KEY:-}"
    volumes:
      - .:/src:ro
      - callsign-gocache:/gocache
      - ./.relay-data:/data
    command: ["go", "run", "./relay/cmd/relay", "-addr=:8090", "-game=http://server:8080/internal/tier", "-data=/data"]

  # `make play-public`: a Cloudflare Tunnel carries https://<your name> to the game server.
  # Cloudflare ends the TLS; nothing is opened on the router. See docs/FRIEND-MATCH.md.
  tunnel:
    image: cloudflare/cloudflared:2026.11.2
    profiles: ["public"]
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: "${CALLSIGN_TUNNEL_TOKEN:-}"
    depends_on:
      - server

  # `make play-public` without a tunnel: https on this machine's port 443, with a Let's
  # Encrypt certificate. The router must forward port 443 here. See docs/FRIEND-MATCH.md.
  https:
    image: caddy:2.11.9-alpine
    profiles: ["https"]
    restart: unless-stopped
    user: "${CALLSIGN_UID:-1000}:${CALLSIGN_GID:-1000}"
    cap_add: ["NET_BIND_SERVICE"]
    environment:
      CALLSIGN_DOMAIN: "${CALLSIGN_DOMAIN:-localhost}"
      XDG_DATA_HOME: /data
      XDG_CONFIG_HOME: /data/config
    volumes:
      - ./tools/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./.caddy-data:/data
    ports:
      - "443:443"
    depends_on:
      - server

volumes:
  callsign-gocache:
    external: true
